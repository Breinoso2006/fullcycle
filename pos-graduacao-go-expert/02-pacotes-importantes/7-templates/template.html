{{ template "header.html"}}
<body>
  <header>
      <h1>Atividades Em Execução</h1>
  </header>
  <table> 
    <thead>
      <tr>
        <th>Atividade</th>
        <th>Tempo Para Finalização</th>
      </tr>
      <tbody>
        {{ range . }}
          <tr>
            <td>{{ .Nome | MM}}</td>
            <td>{{ .TempoParaFinalizar }} horas</td>
          </tr>
        {{ end }}
      </tbody>
  </table>
{{ template "footer.html"}}
